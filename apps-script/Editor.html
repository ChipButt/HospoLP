<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><?= siteName ?> Website Editor</title>
<style>
:root{--bg:#f3efe7;--panel:#fff;--ink:#211f1b;--muted:#756f66;--line:#ded8ce;--brand:#166534;--brand2:#0f5130;--danger:#9b1c1c;--shadow:0 12px 40px rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}.login-card h1{margin:0 0 8px;font-size:28px}.login-card p{color:var(--muted)}label{display:block;font-weight:700;margin:18px 0 7px}.field,input,textarea,select{width:100%;border:1px solid #cbc4b8;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.primary,.secondary,.nav-btn,.small{border:0;border-radius:10px;cursor:pointer;font-weight:800}.primary{width:100%;background:var(--brand);color:#fff;padding:12px 16px;margin-top:16px}.primary:hover{background:var(--brand2)}.secondary{background:#eee9e0;color:var(--ink);padding:10px 14px}.small{padding:7px 9px;background:#f0ece5}.error{color:var(--danger);font-weight:700;margin-top:12px}.muted{color:var(--muted)}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px}.editor{height:100vh;display:none;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.topbar strong{font-size:18px}.save-state{font-size:13px;color:var(--muted);margin-right:10px}.publish{background:var(--brand);color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}.workspace{min-height:0;display:grid;grid-template-columns:minmax(320px,430px) 1fr}.controls{min-height:0;overflow:auto;background:#fff;border-right:1px solid var(--line)}.page-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.nav-btn{padding:9px 7px;background:#f2eee7;color:#4e4941}.nav-btn.active{background:#20352a;color:#fff}.form-wrap{padding:22px}.form-wrap h2{margin:0 0 4px;font-size:22px}.form-wrap>p{margin-top:0;color:var(--muted)}.group{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.group h3{margin:0 0 12px}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}.toggle-row input{width:auto}.repeat-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fcfbf8}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.preview{min-width:0;background:#d8d5cf;padding:14px}.preview-frame{width:100%;height:100%;border:0;border-radius:12px;background:#fff;box-shadow:var(--shadow)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:6px}.status-dot.ok{background:#22a447}.image-preview{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin:8px 0;border:1px solid var(--line)}@media(max-width:850px){.workspace{grid-template-columns:1fr}.preview{display:none}.controls{border-right:0}.topbar{padding:0 12px}.topbar strong{font-size:15px}.page-tabs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <h1><?= siteName ?> Website Editor</h1>
    <p>Sign in to edit your website. You will only see this website.</p>
    <div id="emailStep">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <button class="primary" id="sendCode">Send sign-in code</button>
    </div>
    <div id="codeStep" hidden>
      <label for="code">Six-digit code</label>
      <div class="code-row"><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button class="secondary" id="verifyCode">Sign in</button></div>
      <p class="muted">We sent a code to <strong id="emailEcho"></strong>.</p>
    </div>
    <div class="error" id="loginError" hidden></div>
  </div>
</div>

<div class="editor" id="editor">
  <header class="topbar"><div><strong><?= siteName ?></strong><span class="muted"> &nbsp;Website Editor</span></div><div><span class="save-state" id="saveState"><span class="status-dot"></span>Preview changes only</span><button class="publish" id="publish">Publish changes</button></div></header>
  <div class="workspace">
    <aside class="controls">
      <div class="page-tabs" id="pageTabs"></div>
      <div class="form-wrap" id="form"></div>
    </aside>
    <main class="preview"><iframe class="preview-frame" id="preview" title="Live website preview"></iframe></main>
  </div>
</div>

<script>
const SITE_ID = '<?= siteId ?>';
const PUBLIC_URL = '<?= publicUrl ?>';
const pages = [
  ['home','Home',''],['about','About','about/'],['menu','Flan','menu/'],['hours','Hours','hours/'],['events',"What's On",'whats-on/'],['visit','Visit','visit/']
];
let token = localStorage.getItem(`hospolp:${SITE_ID}:token`) || '';
let data = null, draft = null, activePage = 'home';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err.message||err))).[name](...args))}
// bracket invocation is used below because Apps Script's proxy is dynamic
function run(name,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err.message||err)));r[name](...args)})}
function showError(msg){$('#loginError').textContent=msg;$('#loginError').hidden=false}

$('#sendCode').onclick=async()=>{try{$('#loginError').hidden=true;const email=$('#email').value.trim();if(!email)throw new Error('Enter your email address.');$('#sendCode').disabled=true;await run('requestEditorCode',SITE_ID,email);$('#emailEcho').textContent=email;$('#emailStep').hidden=true;$('#codeStep').hidden=false;$('#code').focus()}catch(e){showError(e.message)}finally{$('#sendCode').disabled=false}};
$('#verifyCode').onclick=async()=>{try{$('#loginError').hidden=true;const email=$('#email').value.trim();const result=await run('verifyEditorCode',SITE_ID,email,$('#code').value.trim());token=result.token;localStorage.setItem(`hospolp:${SITE_ID}:token`,token);startEditor(result)}catch(e){showError(e.message)}};

async function resume(){if(!token)return;try{const result=await run('resumeEditorSession',SITE_ID,token);startEditor(result)}catch(e){localStorage.removeItem(`hospolp:${SITE_ID}:token`);token=''}}
function startEditor(result){data=result.data;draft=clone(data);$('#login').style.display='none';$('#editor').style.display='grid';renderTabs();openPage('home')}
function renderTabs(){const box=$('#pageTabs');box.innerHTML=pages.map(([id,label])=>`<button class="nav-btn ${id===activePage?'active':''}" data-page="${id}">${label}</button>`).join('');box.onclick=e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page)}}
function openPage(id){activePage=id;renderTabs();const page=pages.find(p=>p[0]===id);$('#preview').src=PUBLIC_URL+page[2];renderForm();$('#preview').onload=()=>sendPreview()}
function input(label,path,value,type='text'){return `<label>${label}</label><${type==='textarea'?'textarea':'input'} data-path="${path}" ${type==='checkbox'?'type="checkbox" '+(value?'checked':''):`value="${esc(value)}"`} ${type==='textarea'?'>'+esc(value)+'</textarea>':'>'}`}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('input',()=>{setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value);dirty()});el.addEventListener('change',()=>{setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value);dirty()})});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.index,el.dataset.subindex))}
function setPath(path,value){const parts=path.split('.');let o=draft;for(let i=0;i<parts.length-1;i++){const k=/^\d+$/.test(parts[i])?Number(parts[i]):parts[i];o=o[k]}const last=/^\d+$/.test(parts.at(-1))?Number(parts.at(-1)):parts.at(-1);o[last]=value}
function dirty(){$('#saveState').innerHTML='<span class="status-dot"></span>Not published';sendPreview()}
function sendPreview(){try{$('#preview').contentWindow.postMessage({type:'hospolp-preview',data:draft},'*')}catch(e){}}
function renderForm(){const f=$('#form');const s=draft.site||{};if(activePage==='home')f.innerHTML=`<h2>Home</h2><p>Change the main message visitors see first.</p>${input('Main strapline','site.strapline',s.strapline)}${input('Short welcome','site.shortWelcome',s.shortWelcome,'textarea')}${input('Main message','site.primaryMessage',s.primaryMessage)}<div class="group"><h3>Announcement</h3>${input('Show announcement','site.notice.enabled',s.notice?.enabled,'checkbox')}${input('Heading','site.notice.title',s.notice?.title)}${input('Message','site.notice.text',s.notice?.text,'textarea')}</div>`;
else if(activePage==='about')f.innerHTML=`<h2>About</h2><p>Edit the story and key facts.</p>${input('Heading','site.aboutHeading',s.aboutHeading)}${input('Introduction','site.aboutLead',s.aboutLead,'textarea')}${input('Main text','site.aboutBody',s.aboutBody,'textarea')}<div class="group"><h3>Quick facts</h3>${(s.facts||[]).map((x,i)=>input(`Fact ${i+1}`,`site.facts.${i}`,x)).join('')}</div>`;
else if(activePage==='hours'){const h=draft.hours||{hours:[]};f.innerHTML=`<h2>Opening Hours</h2><p>These appear on the website immediately after publishing.</p>${input('Hours note','hours.note',h.note,'textarea')}<div class="group">${(h.hours||[]).map((x,i)=>`<div class="repeat-card"><strong>${esc(x.day)}</strong><div class="toggle-row"><span>Closed all day</span><input data-path="hours.hours.${i}.closed" type="checkbox" ${x.closed?'checked':''}></div>${input('Display text',`hours.hours.${i}.display`,x.display)}<div class="row2">${input('Opens',`hours.hours.${i}.opens`,x.opens)}${input('Closes',`hours.hours.${i}.closes`,x.closes)}</div></div>`).join('')}</div>`}
else if(activePage==='menu'){const m=draft.menu||{sections:[]};f.innerHTML=`<h2>Flan</h2><p>Edit the menu and prices.</p>${input('Menu heading','menu.heading',m.heading)}${input('Introduction','menu.intro',m.intro,'textarea')}<div class="group"><h3>Menu items</h3>${(m.sections||[]).map((sec,si)=>`<div class="repeat-card"><label>Section</label><input data-path="menu.sections.${si}.name" value="${esc(sec.name)}">${(sec.items||[]).map((it,ii)=>`<div class="group">${input('Name',`menu.sections.${si}.items.${ii}.name`,it.name)}${input('Description',`menu.sections.${si}.items.${ii}.description`,it.description,'textarea')}${input('Price',`menu.sections.${si}.items.${ii}.price`,it.price)}<div class="toggle-row"><span>Available</span><input data-path="menu.sections.${si}.items.${ii}.available" type="checkbox" ${it.available?'checked':''}></div><button class="small" data-action="delete-menu" data-index="${si}" data-subindex="${ii}">Delete item</button></div>`).join('')}<button class="small" data-action="add-menu" data-index="${si}">+ Add item</button></div>`).join('')}</div>`}
else if(activePage==='events'){const e=draft.events||{items:[]};f.innerHTML=`<h2>What's On</h2><p>Add, change or hide events.</p>${input('Introduction','events.intro',e.intro,'textarea')}<div class="group">${(e.items||[]).map((it,i)=>`<div class="repeat-card">${input('Event name',`events.items.${i}.title`,it.title)}${input('When',`events.items.${i}.when`,it.when)}${input('Description',`events.items.${i}.description`,it.description,'textarea')}<div class="toggle-row"><span>Show this event</span><input data-path="events.items.${i}.enabled" type="checkbox" ${it.enabled?'checked':''}></div><button class="small" data-action="delete-event" data-index="${i}">Delete event</button></div>`).join('')}<button class="small" data-action="add-event">+ Add event</button></div>`}
else if(activePage==='visit'){const g=draft.gallery||{items:[]};const ft=draft.features||{items:[]};f.innerHTML=`<h2>Visit</h2><p>Contact details, facilities and photos.</p>${input('Address','site.address',s.address,'textarea')}${input('Phone','site.phone',s.phone)}${input('Email','site.email',s.email)}<div class="group"><h3>Facilities</h3>${(ft.items||[]).map((x,i)=>`<div class="repeat-card">${input('Name',`features.items.${i}.label`,x.label)}<div class="toggle-row"><span>Show</span><input data-path="features.items.${i}.enabled" type="checkbox" ${x.enabled?'checked':''}></div></div>`).join('')}<button class="small" data-action="add-feature">+ Add facility</button></div><div class="group"><h3>Gallery</h3><div class="toggle-row"><span>Show gallery</span><input data-path="gallery.enabled" type="checkbox" ${g.enabled?'checked':''}></div>${(g.items||[]).map((x,i)=>`<div class="repeat-card">${x.image?`<img class="image-preview" src="${esc(x.image)}" alt="">`:''}${input('Image URL',`gallery.items.${i}.image`,x.image)}${input('Description',`gallery.items.${i}.alt`,x.alt)}<label>Replace image</label><input type="file" accept="image/*" data-upload-index="${i}"><button class="small" data-action="delete-gallery" data-index="${i}">Delete photo</button></div>`).join('')}<button class="small" data-action="add-gallery">+ Add photo</button></div>`}
bind();document.querySelectorAll('[data-upload-index]').forEach(el=>el.onchange=()=>uploadImage(el,Number(el.dataset.uploadIndex)))}
function action(type,index,sub){index=Number(index);sub=Number(sub);if(type==='add-menu'){draft.menu.sections[index].items.push({name:'New item',description:'',price:'',available:true})}if(type==='delete-menu'){draft.menu.sections[index].items.splice(sub,1)}if(type==='add-event'){draft.events.items.push({enabled:true,title:'New event',when:'',description:''})}if(type==='delete-event'){draft.events.items.splice(index,1)}if(type==='add-feature'){draft.features.items.push({label:'New facility',enabled:true})}if(type==='add-gallery'){draft.gallery.items.push({image:'',alt:''})}if(type==='delete-gallery'){draft.gallery.items.splice(index,1)}renderForm();dirty()}
async function uploadImage(input,index){const file=input.files[0];if(!file)return;try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const result=await run('uploadEditorImage',SITE_ID,token,{name:file.name,mimeType:file.type,data:b64});draft.gallery.items[index].image=result.url;renderForm();dirty()}catch(e){alert(e.message)}}
$('#publish').onclick=async()=>{try{$('#publish').disabled=true;$('#publish').textContent='Publishing…';const result=await run('publishEditorData',SITE_ID,token,draft);data=clone(result.data);draft=clone(result.data);$('#saveState').innerHTML='<span class="status-dot ok"></span>Published';sendPreview()}catch(e){alert(e.message)}finally{$('#publish').disabled=false;$('#publish').textContent='Publish changes'}};
resume();
</script>
</body>
</html>
