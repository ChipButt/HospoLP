<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><?= siteName ?> Website Editor</title>
<style>
:root{--bg:#f3efe7;--ink:#211f1b;--muted:#756f66;--line:#ded8ce;--brand:#166534;--brand2:#0f5130;--accent:#ffb300;--shadow:0 12px 40px rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}input,textarea{width:100%;border:1px solid #cbc4b8;border-radius:10px;padding:11px 12px;background:#fff}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:700;margin:0 0 6px}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}.muted{color:var(--muted)}.primary,.secondary,.nav-btn,.small,.publish,.danger{border:0;border-radius:10px;cursor:pointer;font-weight:800}.primary{width:100%;padding:12px;background:var(--brand);color:#fff;margin-top:16px}.secondary,.small{padding:9px 11px;background:#eee9e0}.danger{padding:9px 11px;background:#fbe8e8;color:#8d1d1d}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px}.error{color:#9b1c1c;font-weight:700;margin-top:12px}.editor{height:100vh;display:none;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.publish{padding:10px 16px;background:var(--brand);color:#fff}.save-state{font-size:13px;color:var(--muted);margin-right:10px}.workspace{min-height:0;display:grid;grid-template-columns:minmax(340px,440px) 1fr}.controls{overflow:auto;background:#fff;border-right:1px solid var(--line)}.page-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2}.nav-btn{padding:9px 6px;background:#f2eee7}.nav-btn.active{background:#20352a;color:#fff}.form-wrap{padding:22px}.form-wrap h2{margin:0 0 5px}.group{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.repeat-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fcfbf8}.editor-field{border-radius:12px;padding:8px;margin:8px -8px;transition:background .12s ease,box-shadow .12s ease}.editor-field.partner-highlight{background:#fff6d6;box-shadow:0 0 0 3px var(--accent)}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}.toggle input{width:auto}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{min-width:0;background:#d8d5cf;padding:14px}.preview iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff;box-shadow:var(--shadow)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:6px}.dot.ok{background:#22a447}.image-thumb{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}.image-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.image-actions input[type=file]{max-width:220px;padding:7px}.empty-image{padding:24px;border:1px dashed #b9b1a5;border-radius:10px;color:var(--muted);text-align:center;margin-bottom:8px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.preview{display:none}.topbar{padding:0 12px}.save-state{display:none}}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-card"><h1><?= siteName ?> Website Editor</h1><p class="muted">Sign in to edit your website.</p><div id="emailStep"><label>Email address</label><input id="email" type="email" autocomplete="email"><button class="primary" id="sendCode">Send sign-in code</button></div><div id="codeStep" hidden><label>Six-digit code</label><div class="code-row"><input id="code" inputmode="numeric" maxlength="6"><button class="secondary" id="verifyCode">Sign in</button></div><p class="muted">Code sent to <strong id="emailEcho"></strong></p></div><div class="error" id="loginError" hidden></div></div></div>
<div class="editor" id="editor"><header class="topbar"><div><strong><?= siteName ?></strong><span class="muted"> &nbsp;Website Editor</span></div><div><span class="save-state" id="saveState"><span class="dot"></span>Preview changes only</span><button class="publish" id="publish">Publish changes</button></div></header><div class="workspace"><aside class="controls"><div class="page-tabs" id="pageTabs"></div><div class="form-wrap" id="form"></div></aside><main class="preview"><iframe id="preview" title="Live website preview"></iframe></main></div></div>
<script>
const SITE_ID='<?= siteId ?>',PUBLIC_URL='<?= publicUrl ?>';
const pages=[['home','Home',''],['about','About','about.html'],['menu','Flan','menu.html'],['hours','Hours','hours.html'],['events',"What's On",'whats-on.html'],['visit','Visit','visit.html']];
let token=localStorage.getItem(`hospolp:${SITE_ID}:token`)||'',draft=null,active='home';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=o=>JSON.parse(JSON.stringify(o));
function run(name,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));r[name](...args)})}
function showError(m){$('#loginError').textContent=m;$('#loginError').hidden=false}
$('#sendCode').onclick=async()=>{try{$('#loginError').hidden=true;const email=$('#email').value.trim();if(!email)throw Error('Enter your email address.');await run('requestEditorCode',SITE_ID,email);$('#emailEcho').textContent=email;$('#emailStep').hidden=true;$('#codeStep').hidden=false;$('#code').focus()}catch(e){showError(e.message)}};
$('#verifyCode').onclick=async()=>{try{const r=await run('verifyEditorCode',SITE_ID,$('#email').value.trim(),$('#code').value.trim());token=r.token;localStorage.setItem(`hospolp:${SITE_ID}:token`,token);start(r)}catch(e){showError(e.message)}};
async function resume(){if(!token)return;try{start(await run('resumeEditorSession',SITE_ID,token))}catch(e){localStorage.removeItem(`hospolp:${SITE_ID}:token`);token=''}}
function start(r){draft=clone(r.data);$('#login').style.display='none';$('#editor').style.display='grid';openPage('home')}
function tabs(){$('#pageTabs').innerHTML=pages.map(([id,l])=>`<button class="nav-btn ${id===active?'active':''}" data-page="${id}">${l}</button>`).join('');$('#pageTabs').onclick=e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page)}}
function openPage(id){active=id;tabs();const p=pages.find(x=>x[0]===id);$('#preview').src=PUBLIC_URL+p[2];render();$('#preview').onload=sendPreview}
function field(label,path,value,type='text'){if(type==='checkbox')return `<div class="editor-field" data-editor-key="${path}"><div class="toggle"><span>${label}</span><input type="checkbox" data-path="${path}" ${value?'checked':''}></div></div>`;if(type==='textarea')return `<div class="editor-field" data-editor-key="${path}"><label>${label}</label><textarea data-path="${path}">${esc(value)}</textarea></div>`;return `<div class="editor-field" data-editor-key="${path}"><label>${label}</label><input data-path="${path}" value="${esc(value)}"></div>`}
function imageField(label,path,value){return `<div class="editor-field" data-editor-key="${path}"><label>${label}</label>${value?`<img class="image-thumb" src="${esc(value)}" alt="">`:`<div class="empty-image">No image</div>`}<div class="image-actions"><input type="file" accept="image/*" data-upload-path="${path}"><button class="danger" type="button" data-remove-image="${path}" ${value?'':'disabled'}>Remove image</button></div></div>`}
function setPath(path,val){const ps=path.split('.');let o=draft;for(let i=0;i<ps.length-1;i++)o=o[/^\d+$/.test(ps[i])?+ps[i]:ps[i]];const k=/^\d+$/.test(ps.at(-1))?+ps.at(-1):ps.at(-1);o[k]=val}
function highlightField(key){document.querySelectorAll('.partner-highlight').forEach(x=>x.classList.remove('partner-highlight'));if(!key)return;const el=document.querySelector(`.editor-field[data-editor-key="${CSS.escape(key)}"]`);if(el)el.classList.add('partner-highlight')}
function sendHighlight(key){try{$('#preview').contentWindow.postMessage({type:'hospolp-highlight',key:key||null},'*')}catch(e){}}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>{const fn=()=>{setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value);dirty()};el.oninput=fn;el.onchange=fn});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,+el.dataset.index,+el.dataset.subindex));document.querySelectorAll('[data-upload-path]').forEach(el=>el.onchange=()=>upload(el,el.dataset.uploadPath));document.querySelectorAll('[data-remove-image]').forEach(el=>el.onclick=()=>{setPath(el.dataset.removeImage,'');render();dirty()});document.querySelectorAll('.editor-field[data-editor-key]').forEach(el=>{el.onmouseenter=()=>sendHighlight(el.dataset.editorKey);el.onmouseleave=()=>sendHighlight(null)})}
function dirty(){$('#saveState').innerHTML='<span class="dot"></span>Not published';sendPreview()}
function sendPreview(){try{$('#preview').contentWindow.postMessage({type:'hospolp-preview',data:draft},'*')}catch(e){}}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='hospolp-preview-hover')highlightField(e.data.key||null)});
function render(){const f=$('#form'),s=draft.site||{};
if(active==='home')f.innerHTML=`<h2>Home</h2><p class="muted">Hover over a field or its matching item in the preview to see the pair.</p>${field('Main strapline','site.strapline',s.strapline)}${field('Short welcome','site.shortWelcome',s.shortWelcome,'textarea')}${field('Main message','site.primaryMessage',s.primaryMessage)}<div class="group"><h3>Images</h3>${imageField('Logo','site.logoImage',s.logoImage)}${imageField('Main banner / hero image','site.heroImage',s.heroImage)}${field('Hero image description','site.heroImageAlt',s.heroImageAlt)}</div><div class="group"><h3>Announcement</h3>${field('Show announcement','site.notice.enabled',s.notice?.enabled,'checkbox')}${field('Heading','site.notice.title',s.notice?.title)}${field('Message','site.notice.text',s.notice?.text,'textarea')}</div>`;
if(active==='about')f.innerHTML=`<h2>About</h2>${field('Heading','site.aboutHeading',s.aboutHeading)}${field('Introduction','site.aboutLead',s.aboutLead,'textarea')}${field('Main text','site.aboutBody',s.aboutBody,'textarea')}<div class="group"><h3>Quick facts</h3>${(s.facts||[]).map((x,i)=>field(`Fact ${i+1}`,`site.facts.${i}`,x)).join('')}</div>`;
if(active==='hours'){const h=draft.hours||{hours:[]};f.innerHTML=`<h2>Opening Hours</h2>${field('Hours note','hours.note',h.note,'textarea')}${(h.hours||[]).map((x,i)=>`<div class="repeat-card"><strong>${esc(x.day)}</strong>${field('Closed all day',`hours.hours.${i}.closed`,x.closed,'checkbox')}${field('Display text',`hours.hours.${i}.display`,x.display)}<div class="row2">${field('Opens',`hours.hours.${i}.opens`,x.opens)}${field('Closes',`hours.hours.${i}.closes`,x.closes)}</div></div>`).join('')}`}
if(active==='menu'){const m=draft.menu||{sections:[]};f.innerHTML=`<h2>Flan</h2>${field('Menu heading','menu.heading',m.heading)}${field('Introduction','menu.intro',m.intro,'textarea')}${(m.sections||[]).map((sec,si)=>`<div class="repeat-card">${field('Section',`menu.sections.${si}.name`,sec.name)}${(sec.items||[]).map((it,ii)=>`<div class="group">${field('Name',`menu.sections.${si}.items.${ii}.name`,it.name)}${field('Description',`menu.sections.${si}.items.${ii}.description`,it.description,'textarea')}${field('Price',`menu.sections.${si}.items.${ii}.price`,it.price)}${field('Available',`menu.sections.${si}.items.${ii}.available`,it.available,'checkbox')}<button class="small" data-action="delete-menu" data-index="${si}" data-subindex="${ii}">Delete item</button></div>`).join('')}<button class="small" data-action="add-menu" data-index="${si}">+ Add item</button></div>`).join('')}`}
if(active==='events'){const e=draft.events||{items:[]};f.innerHTML=`<h2>What's On</h2>${field('Introduction','events.intro',e.intro,'textarea')}${(e.items||[]).map((it,i)=>`<div class="repeat-card">${field('Event name',`events.items.${i}.title`,it.title)}${field('When',`events.items.${i}.when`,it.when)}${field('Description',`events.items.${i}.description`,it.description,'textarea')}${field('Show event',`events.items.${i}.enabled`,it.enabled,'checkbox')}<button class="small" data-action="delete-event" data-index="${i}">Delete event</button></div>`).join('')}<button class="small" data-action="add-event">+ Add event</button>`}
if(active==='visit'){const ft=draft.features||{items:[]},g=draft.gallery||{items:[]};f.innerHTML=`<h2>Visit</h2>${field('Address','site.address',s.address,'textarea')}${field('Phone','site.phone',s.phone)}${field('Email','site.email',s.email)}<div class="group"><h3>Facilities</h3>${(ft.items||[]).map((x,i)=>`<div class="repeat-card">${field('Name',`features.items.${i}.label`,x.label)}${field('Show',`features.items.${i}.enabled`,x.enabled,'checkbox')}<button class="small" data-action="delete-feature" data-index="${i}">Remove facility</button></div>`).join('')}<button class="small" data-action="add-feature">+ Add facility</button></div><div class="group"><h3>Gallery</h3>${field('Show gallery','gallery.enabled',g.enabled,'checkbox')}${(g.items||[]).map((x,i)=>`<div class="repeat-card">${imageField(`Photo ${i+1}`,`gallery.items.${i}.image`,x.image)}${field('Photo description',`gallery.items.${i}.alt`,x.alt)}<button class="small" data-action="delete-gallery" data-index="${i}">Remove photo</button></div>`).join('')}<button class="small" data-action="add-gallery">+ Add photo</button></div>`}
bind()}
function action(t,i,j){if(t==='add-menu')draft.menu.sections[i].items.push({name:'New item',description:'',price:'',available:true});if(t==='delete-menu')draft.menu.sections[i].items.splice(j,1);if(t==='add-event')draft.events.items.push({enabled:true,title:'New event',when:'',description:''});if(t==='delete-event')draft.events.items.splice(i,1);if(t==='add-feature')draft.features.items.push({label:'New facility',enabled:true});if(t==='delete-feature')draft.features.items.splice(i,1);if(t==='add-gallery')draft.gallery.items.push({image:'',alt:''});if(t==='delete-gallery')draft.gallery.items.splice(i,1);render();dirty()}
async function upload(el,path){const file=el.files[0];if(!file)return;try{el.disabled=true;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const result=await run('uploadEditorImage',SITE_ID,token,{name:file.name,mimeType:file.type,data});setPath(path,result.url);render();dirty()}catch(e){alert(e.message)}finally{el.disabled=false}}
$('#publish').onclick=async()=>{try{$('#publish').disabled=true;$('#publish').textContent='Publishing…';const r=await run('publishEditorData',SITE_ID,token,draft);draft=clone(r.data);$('#saveState').innerHTML='<span class="dot ok"></span>Published';sendPreview()}catch(e){alert(e.message)}finally{$('#publish').disabled=false;$('#publish').textContent='Publish changes'}};
resume();
</script>
</body>
</html>
