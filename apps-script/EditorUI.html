<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><?= siteName ?> Website Editor</title>
<style>
:root{--bg:#eeeae2;--panel:#fff;--ink:#24211d;--muted:#746e65;--line:#ddd6ca;--brand:#235b3d;--accent:#ffb300;--danger:#9b2525;--shadow:0 12px 36px rgba(0,0,0,.09)}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}input,textarea{width:100%;padding:11px 12px;border:1px solid #c9c1b5;border-radius:10px;background:#fff}textarea{min-height:92px;resize:vertical}.muted{color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(450px,100%);background:#fff;padding:34px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login-card h1{margin:0 0 6px}.login-card label{display:block;font-weight:700;margin:16px 0 6px}.primary,.publish,.nav-btn,.small,.danger,.linkbtn,.draftbtn{border:0;border-radius:10px;font-weight:800}.primary,.publish{background:var(--brand);color:#fff;padding:11px 15px}.primary{width:100%;margin-top:18px}.small,.linkbtn,.draftbtn{background:#eee9e0;padding:9px 11px}.draftbtn{background:#e8f1eb;color:#1c5135;border:1px solid #cfe0d4}.danger{background:#f9e5e5;color:var(--danger);padding:9px 11px}.error{margin-top:12px;color:#9b1c1c;font-weight:700}.editor{height:100vh;display:none;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.top-actions{display:flex;align-items:center;gap:8px}.save-state{font-size:13px;color:var(--muted);min-width:110px;text-align:right}.save-state.ok{color:#24633f}.save-state.warn{color:#966600}.workspace{min-height:0;display:grid;grid-template-columns:minmax(350px,450px) 1fr}.controls{overflow:auto;background:#fff;border-right:1px solid var(--line)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}.nav-btn{padding:9px 5px;background:#f1ede6}.nav-btn.active{background:#25382e;color:#fff}.form{padding:22px}.form h2{margin:0 0 5px}.draft-note{background:#eef7f1;border:1px solid #d5e8da;padding:10px 12px;border-radius:10px;margin:0 0 16px;color:#28573a}.group{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.group:first-child{margin-top:0;padding-top:0;border:0}.group h3{margin:0 0 12px}.field{margin:8px -8px;padding:8px;border-radius:12px;transition:.12s}.field.partner{background:#fff4c8;box-shadow:0 0 0 3px var(--accent)}.field label{display:block;font-weight:700;margin-bottom:6px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}.toggle input{width:auto}.card{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fcfbf8}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.image-thumb{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:7px 0}.image-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.image-actions input{max-width:230px;padding:7px}.preview{min-width:0;padding:14px;background:#d6d3cd}.preview iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff;box-shadow:var(--shadow)}.account{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:20;padding:20px}.account-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:24px}.account-card label{display:block;font-weight:700;margin:13px 0 5px}.account-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.preview{display:none}.save-state{font-size:12px;min-width:0}.topbar{height:auto;min-height:64px;padding:7px 10px}.topbar .muted{display:none}.top-actions{gap:5px;flex-wrap:wrap;justify-content:flex-end}.top-actions button{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-card"><h1><?= siteName ?></h1><p class="muted">Website Editor</p><label>Email address</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" id="loginButton">Log in</button><div class="error" id="loginError" hidden></div></div></div>
<div class="editor" id="editor"><header class="topbar"><div><strong><?= siteName ?></strong><span class="muted"> &nbsp;Website Editor</span></div><div class="top-actions"><span class="save-state" id="saveState">Up to date</span><button class="draftbtn" id="saveDraft">Save draft</button><button class="linkbtn" id="accountButton">Password</button><button class="publish" id="publish">Publish changes</button></div></header><div class="workspace"><aside class="controls"><div class="tabs" id="tabs"></div><div class="form" id="form"></div></aside><main class="preview"><iframe id="preview" title="Live website preview"></iframe></main></div></div>
<div class="account" id="account"><div class="account-card"><h2>Change password</h2><label>Current password</label><input id="currentPassword" type="password"><label>New password</label><input id="newPassword" type="password"><label>Confirm new password</label><input id="confirmPassword" type="password"><div class="account-actions"><button class="linkbtn" id="cancelPassword">Cancel</button><button class="primary" id="savePassword" style="width:auto;margin:0">Change password</button></div></div></div>
<script>
const SITE_ID='<?= siteId ?>',PUBLIC_URL='<?= publicUrl ?>';
let token=localStorage.getItem(`hospolp:${SITE_ID}:token`)||'',draft=null,schema=null,activePage=null,saveTimer=null,saveInFlight=false,saveQueued=false,restoredDraft=false;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=o=>JSON.parse(JSON.stringify(o));
function run(name,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));r[name](...args)})}
function getPath(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[/^\d+$/.test(k)?+k:k],draft)}
function setPath(path,value){const p=path.split('.');let o=draft;for(let i=0;i<p.length-1;i++){const k=/^\d+$/.test(p[i])?+p[i]:p[i];if(o[k]==null)o[k]={};o=o[k]}const k=/^\d+$/.test(p.at(-1))?+p.at(-1):p.at(-1);o[k]=value}
function showLoginError(m){$('#loginError').textContent=m;$('#loginError').hidden=false}
function formatTime(iso){if(!iso)return'';try{return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function setSaveState(text,kind){const el=$('#saveState');el.textContent=text;el.className='save-state'+(kind?' '+kind:'')}
$('#loginButton').onclick=async()=>{try{$('#loginError').hidden=true;const r=await run('loginEditor',SITE_ID,$('#email').value.trim(),$('#password').value);token=r.token;localStorage.setItem(`hospolp:${SITE_ID}:token`,token);start(r)}catch(e){showLoginError(e.message)}};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginButton').click()});
async function resume(){if(!token)return;try{start(await run('resumeEditorSession',SITE_ID,token))}catch(e){localStorage.removeItem(`hospolp:${SITE_ID}:token`);token=''}}
function start(r){restoredDraft=!!r.draft;draft=clone(r.draft||r.data);schema=r.schema;activePage=schema.pages[0]?.id;$('#login').style.display='none';$('#editor').style.display='grid';setSaveState(restoredDraft?`Draft restored${r.draftSavedAt?' · '+formatTime(r.draftSavedAt):''}`:'Up to date',restoredDraft?'ok':'');renderTabs();openPage(activePage)}
function renderTabs(){$('#tabs').innerHTML=schema.pages.map(p=>`<button class="nav-btn ${p.id===activePage?'active':''}" data-page="${esc(p.id)}">${esc(p.label)}</button>`).join('');$('#tabs').onclick=e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page)}}
function openPage(id){activePage=id;renderTabs();const p=schema.pages.find(x=>x.id===id);$('#preview').src=PUBLIC_URL+(p.url||'');renderForm();$('#preview').onload=sendPreview}
function normalisePath(path){try{let p=new URL(path,PUBLIC_URL).pathname;p=p.replace(/index\.html$/i,'');if(!p.endsWith('/'))p+='/';return p}catch(e){return String(path||'')}}
function syncEditorToPreview(pathname){if(!schema?.pages?.length||!pathname)return;const current=normalisePath(pathname);const match=schema.pages.find(p=>normalisePath(new URL(p.url||'',PUBLIC_URL).pathname)===current);if(!match||match.id===activePage)return;activePage=match.id;renderTabs();renderForm();sendPreview()}
function wrap(path,inner){return `<div class="field" data-editor-key="${esc(path)}">${inner}</div>`}
function basicField(f){const v=getPath(f.path);if(f.type==='boolean')return wrap(f.path,`<div class="toggle"><strong>${esc(f.label)}</strong><input type="checkbox" data-path="${esc(f.path)}" ${v?'checked':''}></div>`);if(f.type==='textarea')return wrap(f.path,`<label>${esc(f.label)}</label><textarea data-path="${esc(f.path)}">${esc(v)}</textarea>`);if(f.type==='image')return imageField(f.label,f.path,v);return wrap(f.path,`<label>${esc(f.label)}</label><input data-path="${esc(f.path)}" value="${esc(v)}">`)}
function imageField(label,path,value){const src=value?resolveImage(value):'';return wrap(path,`<label>${esc(label)}</label>${src?`<img class="image-thumb" src="${esc(src)}" alt="">`:'<p class="muted">No image selected</p>'}<div class="image-actions"><input type="file" accept="image/*" data-upload="${esc(path)}"><button type="button" class="danger" data-remove-image="${esc(path)}" ${value?'':'disabled'}>Remove</button></div>`)}
function resolveImage(path){if(!path)return'';if(/^https?:\/\//i.test(path))return path;return PUBLIC_URL+String(path).replace(/^\//,'')}
function renderComplex(f){const items=getPath(f.path)||[];
if(f.type==='hours')return wrap(f.path,`<label>${esc(f.label)}</label>${items.map((x,i)=>`<div class="card"><strong>${esc(x.day||'Day')}</strong>${basicField({label:'Closed all day',type:'boolean',path:`${f.path}.${i}.closed`})}${basicField({label:'Display text',type:'text',path:`${f.path}.${i}.display`})}<div class="row2">${basicField({label:'Opens',type:'text',path:`${f.path}.${i}.opens`})}${basicField({label:'Closes',type:'text',path:`${f.path}.${i}.closes`})}</div></div>`).join('')}`);
if(f.type==='menu')return wrap(f.path,`<label>${esc(f.label)}</label>${items.map((sec,si)=>`<div class="card">${basicField({label:'Section name',type:'text',path:`${f.path}.${si}.name`})}${(sec.items||[]).map((it,ii)=>`<div class="card">${basicField({label:'Item name',type:'text',path:`${f.path}.${si}.items.${ii}.name`})}${basicField({label:'Description',type:'textarea',path:`${f.path}.${si}.items.${ii}.description`})}${basicField({label:'Price',type:'text',path:`${f.path}.${si}.items.${ii}.price`})}${basicField({label:'Available',type:'boolean',path:`${f.path}.${si}.items.${ii}.available`})}<button class="danger" data-action="remove-menu" data-path="${esc(f.path)}" data-a="${si}" data-b="${ii}">Remove item</button></div>`).join('')}<button class="small" data-action="add-menu" data-path="${esc(f.path)}" data-a="${si}">+ Add item</button></div>`).join('')}`);
if(f.type==='events')return wrap(f.path,`<label>${esc(f.label)}</label>${items.map((it,i)=>`<div class="card">${basicField({label:'Event name',type:'text',path:`${f.path}.${i}.title`})}${basicField({label:'When',type:'text',path:`${f.path}.${i}.when`})}${basicField({label:'Description',type:'textarea',path:`${f.path}.${i}.description`})}${basicField({label:'Show event',type:'boolean',path:`${f.path}.${i}.enabled`})}<button class="danger" data-action="remove-event" data-path="${esc(f.path)}" data-a="${i}">Remove event</button></div>`).join('')}<button class="small" data-action="add-event" data-path="${esc(f.path)}">+ Add event</button>`);
if(f.type==='features')return wrap(f.path,`<label>${esc(f.label)}</label>${items.map((it,i)=>`<div class="card">${basicField({label:'Facility',type:'text',path:`${f.path}.${i}.label`})}${basicField({label:'Show',type:'boolean',path:`${f.path}.${i}.enabled`})}<button class="danger" data-action="remove-feature" data-path="${esc(f.path)}" data-a="${i}">Remove</button></div>`).join('')}<button class="small" data-action="add-feature" data-path="${esc(f.path)}">+ Add facility</button>`);
if(f.type==='gallery')return wrap(f.path,`<label>${esc(f.label)}</label>${items.map((it,i)=>`<div class="card">${imageField(`Photo ${i+1}`,`${f.path}.${i}.image`,it.image)}${basicField({label:'Photo description',type:'text',path:`${f.path}.${i}.alt`})}<button class="danger" data-action="remove-gallery" data-path="${esc(f.path)}" data-a="${i}">Remove photo</button></div>`).join('')}<button class="small" data-action="add-gallery" data-path="${esc(f.path)}">+ Add photo</button>`);
return basicField(f)}
function renderForm(){const p=schema.pages.find(x=>x.id===activePage);$('#form').innerHTML=`<h2>${esc(p.label)}</h2><p class="muted">Changes appear in the preview immediately. They are saved as a private draft automatically and only go live when you press <strong>Publish changes</strong>.</p>${restoredDraft?'<p class="draft-note">Your previously saved draft has been restored. You can carry on from where you left off.</p>':''}`+p.groups.map(g=>`<section class="group"><h3>${esc(g.label)}</h3>${g.fields.map(f=>['hours','menu','events','features','gallery'].includes(f.type)?renderComplex(f):basicField(f)).join('')}</section>`).join('');bind()}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>{const fn=()=>{setPath(el.dataset.path,el.type==='checkbox'?el.checked:el.value);dirty()};el.oninput=fn;el.onchange=fn});document.querySelectorAll('[data-upload]').forEach(el=>el.onchange=()=>uploadImage(el,el.dataset.upload));document.querySelectorAll('[data-remove-image]').forEach(el=>el.onclick=()=>{setPath(el.dataset.removeImage,'');renderForm();dirty()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>doAction(el));document.querySelectorAll('.field[data-editor-key]').forEach(el=>{el.onmouseenter=()=>sendHighlight(el.dataset.editorKey);el.onmouseleave=()=>sendHighlight(null)})}
function doAction(el){const list=getPath(el.dataset.path)||[],a=+el.dataset.a,b=+el.dataset.b;switch(el.dataset.action){case'add-menu':list[a].items.push({name:'New item',description:'',price:'',available:true});break;case'remove-menu':list[a].items.splice(b,1);break;case'add-event':list.push({enabled:true,title:'New event',when:'',description:''});break;case'remove-event':list.splice(a,1);break;case'add-feature':list.push({label:'New facility',enabled:true});break;case'remove-feature':list.splice(a,1);break;case'add-gallery':list.push({image:'',alt:''});break;case'remove-gallery':list.splice(a,1);break}renderForm();dirty()}
async function uploadImage(input,path){const file=input.files[0];if(!file)return;if(file.size>8*1024*1024){alert('Please choose an image smaller than 8 MB.');return}input.disabled=true;try{const data=await fileToBase64(file);const r=await run('uploadEditorImage',SITE_ID,token,{name:file.name,mimeType:file.type,data});setPath(path,r.path);renderForm();dirty()}catch(e){alert(e.message)}finally{input.disabled=false}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
function dirty(){restoredDraft=false;setSaveState('Saving draft…','warn');sendPreview();scheduleDraftSave()}
function scheduleDraftSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveDraftNow(false),1200)}
async function saveDraftNow(manual){if(!draft||!token)return;if(saveInFlight){saveQueued=true;return}saveInFlight=true;saveQueued=false;clearTimeout(saveTimer);if(manual)setSaveState('Saving draft…','warn');try{const r=await run('saveEditorDraft',SITE_ID,token,draft);setSaveState(`Draft saved · ${formatTime(r.savedAt)}`,'ok')}catch(e){setSaveState('Draft not saved','warn');if(manual)alert('Your draft could not be saved. '+e.message)}finally{saveInFlight=false;if(saveQueued){saveQueued=false;scheduleDraftSave()}}}
function sendPreview(){try{$('#preview').contentWindow.postMessage({type:'hospolp-preview',data:draft},'*')}catch(e){}}
function sendHighlight(key){try{$('#preview').contentWindow.postMessage({type:'hospolp-highlight',key:key||null},'*')}catch(e){}}
function highlightField(key){document.querySelectorAll('.field.partner').forEach(x=>x.classList.remove('partner'));if(!key)return;const el=document.querySelector(`.field[data-editor-key="${CSS.escape(key)}"]`);if(el){el.classList.add('partner');el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
window.addEventListener('message',e=>{if(e.data?.type==='hospolp-preview-hover')highlightField(e.data.key||null);if(e.data?.type==='hospolp-preview-page')syncEditorToPreview(e.data.pathname)});
$('#saveDraft').onclick=async()=>{const b=$('#saveDraft');b.disabled=true;try{await saveDraftNow(true)}finally{b.disabled=false}};
$('#publish').onclick=async()=>{const b=$('#publish');try{clearTimeout(saveTimer);b.disabled=true;b.textContent='Publishing…';const r=await run('publishEditorData',SITE_ID,token,draft);draft=clone(r.data);restoredDraft=false;setSaveState('Published','ok');renderForm();sendPreview()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Publish changes'}};
$('#accountButton').onclick=()=>$('#account').style.display='grid';$('#cancelPassword').onclick=()=>$('#account').style.display='none';$('#savePassword').onclick=async()=>{const n=$('#newPassword').value;if(n!==$('#confirmPassword').value){alert('The new passwords do not match.');return}try{await run('changeEditorPassword',SITE_ID,token,$('#currentPassword').value,n);$('#account').style.display='none';$('#currentPassword').value=$('#newPassword').value=$('#confirmPassword').value='';alert('Password changed.')}catch(e){alert(e.message)}};
window.addEventListener('beforeunload',()=>{if(saveTimer)saveDraftNow(false)});
resume();
</script>
</body>
</html>
