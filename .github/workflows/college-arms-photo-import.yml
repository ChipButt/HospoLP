name: College Arms – import verified photos and assign page heroes
on:
  push:
    paths:
      - .github/workflows/college-arms-photo-import.yml
      - samples/college-arms/tools/import_photos.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing requirements
        run: python -m pip install --quiet Pillow requests numpy
      - name: Download and validate photos, then update six pages atomically
        run: python samples/college-arms/tools/import_photos.py
      - name: Commit only after all mandatory images passed validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/college-arms/
          if ! git diff --cached --quiet; then
            git commit -m "College Arms: self-host distinct verified page hero photos"
            git push
          fi
