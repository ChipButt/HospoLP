name: College Arms – prepare real pint photograph
on:
  push:
    paths:
      - .github/workflows/college-arms-pint-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Crop a real College Arms pint from the existing original
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageEnhance
          root=Path("samples/college-arms/assets/photos")
          source=Image.open(root/"food-drink.jpg").convert("RGB")
          w,h=source.size
          # Upper-left collage quadrant shows a Guinness pint at the College Arms green.
          # Exclude the separate menu advert, cartoon and all other quadrants.
          crop=source.crop((0,0,(w//2)-3,(h//2)-3))
          crop=ImageEnhance.Contrast(crop).enhance(1.05)
          crop.resize((900,1100),Image.Resampling.LANCZOS).save(root/"food-drink-guinness.jpg","JPEG",quality=90,optimize=True)
          assert (root/"food-drink-guinness.jpg").stat().st_size>12000
          print("Saved distinct genuine pub pint photo",crop.size)
          PY
      - name: Commit cropped asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/college-arms/assets/photos/food-drink-guinness.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add real pint from College Arms photo for Food and Drink page"
            git push
          fi
