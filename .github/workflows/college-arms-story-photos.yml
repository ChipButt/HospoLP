name: College Arms – restore user-selected Story photographs
on:
  push:
    paths:
      - .github/workflows/college-arms-story-photos.yml
      - samples/college-arms/tools/import_story_photos.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow requests
      - name: Fetch and validate three specific photographs
        id: photos
        continue-on-error: true
        run: python samples/college-arms/tools/import_story_photos.py
      - name: Commit validated images or diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/college-arms/
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact College Arms staff, village green and exterior photographs"
            git push
          fi
      - name: Fail if source images unavailable
        if: steps.photos.outcome == 'failure'
        run: exit 1
