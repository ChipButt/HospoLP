name: Village Cafe social feed

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-cafe-social-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Refresh public café posts
        env:
          CAFE_FB_PAGE_ID: ${{ secrets.CAFE_FB_PAGE_ID }}
          CAFE_FB_PAGE_TOKEN: ${{ secrets.CAFE_FB_PAGE_TOKEN }}
          CAFE_IG_USER_ID: ${{ secrets.CAFE_IG_USER_ID }}
          CAFE_IG_ACCESS_TOKEN: ${{ secrets.CAFE_IG_ACCESS_TOKEN }}
        run: python scripts/sync_village_cafe_social.py
      - name: Commit new posts and pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/village-cafe-bidford/data/social-posts.json
          git add samples/village-cafe-bidford/assets/village-cafe/social/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Village Cafe social posts"
            git push origin HEAD:main
          fi
