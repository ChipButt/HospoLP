name: College Arms – import genuine Food and Drink photos
on:
  push:
    paths:
      - .github/workflows/college-arms-food-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow requests
      - name: Download and check real College Arms food photographs
        run: |
          python - <<'PY'
          from PIL import Image,ImageStat
          import requests,io,json
          from pathlib import Path
          root=Path("samples/college-arms")
          dest=root/"assets/photos"
          urls={
             "food-dish":"https://img02.restaurantguru.com/c87c-College-Arms-Lower-Quinton-food.jpg",
             "food-fish-chips":"https://img02.restaurantguru.com/c618-Pub-and-bar-College-Arms-fish-and-chips.jpg",
             "food-meal":"https://img02.restaurantguru.com/c8aa-College-Arms-Lower-Quinton-meals.jpg",
             "food-drink":"https://img02.restaurantguru.com/c375-College-Arms-Lower-Quinton-beer.jpg",
             "historical-menu-1":"https://menu02.restaurantguru.com/m8/College-Arms-Pub-and-bar-menu-2.jpg",
             "historical-menu-2":"https://menu02.restaurantguru.com/m8/menu-College-Arms-2.jpg",
          }
          ok=[]
          failed=[]
          for name,url in urls.items():
            try:
              r=requests.get(url,timeout=20,headers={"User-Agent":"Mozilla/5.0","Referer":"https://restaurantguru.com/"})
              r.raise_for_status()
              im=Image.open(io.BytesIO(r.content));im.load()
              if im.width<250 or im.height<200:raise ValueError("image too small")
              im=im.convert("RGB")
              if im.width>1800: im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
              im.save(dest/(name+".jpg"),"JPEG",quality=88,optimize=True)
              print("OK",name,im.size,flush=True)
              ok.append(name)
            except Exception as e:
              failed.append(name);print("FAILED",name,str(e)[:160],flush=True)
          (root/"assets/food-fetch-report.json").write_text(json.dumps({"available":ok,"missing":failed},indent=2)+"\n")
          if "food-fish-chips" not in ok and "food-dish" not in ok and "food-meal" not in ok:
            raise SystemExit("No verified food photograph downloaded; page not modified")
          path=root/"food.html"
          text=path.read_text()
          hero="food-fish-chips" if "food-fish-chips" in ok else ("food-dish" if "food-dish" in ok else "food-meal")
          text=text.replace("url('assets/photos/restaurant.jpg')","url('assets/photos/"+hero+".jpg')")
          src='src="assets/photos/lounge.jpg"'
          if src in text:
            photo="food-dish" if "food-dish" in ok else hero
            text=text.replace(src,'src="assets/photos/'+photo+'.jpg"')
            text=text.replace('alt="The College Arms pub courtyard"','alt="Food served at The College Arms"')
          # Use only confirmed image files; old menu photography is clearly historical.
          if "food-meal" in ok and "food-dish" in ok:
            anchor='</section></main>'
            gallery='<section class="section"><div class="wrap"><div class="tag">From our kitchen</div><h2>A taste of the College Arms.</h2><div class="food-photos">'
            for name,label in [("food-meal","A meal at The College Arms"),("food-fish-chips","Fish and chips served at The College Arms"),("food-drink","A pint at The College Arms")]:
              if name in ok:gallery+='<figure><img loading="lazy" src="assets/photos/'+name+'.jpg" alt="'+label+'"></figure>'
            gallery+='</div></div></section>'
            text=text.replace(anchor,'</section>'+gallery+'</main>',1)
          menus=[n for n in ("historical-menu-1","historical-menu-2") if n in ok]
          if menus:
            gallery='<section class="section paper"><div class="wrap"><div class="tag">From the archives</div><h2>Past menus.</h2><p>These older menus offer a glimpse of the College Arms over the years. For dishes and prices served today, please contact the pub.</p><div class="food-menu-archive">'
            for name in menus:gallery+='<a href="assets/photos/'+name+'.jpg" target="_blank" rel="noopener"><img loading="lazy" src="assets/photos/'+name+'.jpg" alt="Historical College Arms printed menu photograph"></a>'
            gallery+='</div></div></section>'
            text=text.replace('</main>',gallery+'</main>')
          text=text.replace('style.css?v=hero-parity-20261030b','style.css?v=real-food-20261030')
          path.write_text(text)
          css=root/"style.css"
          css.write_text(css.read_text()+"""
          .food-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
          .food-photos figure{margin:0}.food-photos img{width:100%;height:300px;object-fit:cover}
          .food-menu-archive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin-top:32px}
          .food-menu-archive img{width:100%;height:auto;max-height:600px;object-fit:contain;background:#fff}
          @media(max-width:700px){.food-photos{grid-template-columns:1fr}.food-photos img{height:250px}.food-menu-archive{grid-template-columns:1fr}}
          """)
          PY
      - name: Commit local food photos and updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/college-arms/
          if ! git diff --cached --quiet; then
            git commit -m "Add genuine College Arms food and historic menu photos"
            git push
          fi
