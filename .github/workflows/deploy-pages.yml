name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Expand supplied Base44 static samples
        run: |
          mkdir -p samples/base44-static
          cat $(find .base44-static -maxdepth 1 -type f -name 'chunk-*' | sort -V) > /tmp/base44-static.zip
          unzip -q /tmp/base44-static.zip -d /tmp/base44-static
          cp -a /tmp/base44-static/site/. samples/base44-static/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
