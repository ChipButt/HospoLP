<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HospoLP Website Brief</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2ea;color:#1f2523;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:620px;margin:24px;padding:34px;border:1px solid #dcd5c8;border-radius:24px;background:#fffdf8;box-shadow:0 18px 45px rgba(34,44,39,.09)}.tag{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#365f4b}h1{font-size:clamp(2rem,8vw,3.5rem);line-height:1;margin:.4rem 0 1rem;letter-spacing:-.04em}p{color:#68716d;font-size:1.05rem}.button{display:inline-block;margin-top:10px;background:#365f4b;color:white;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:800}.setup{display:none;background:#fff4d8;border-radius:12px;padding:14px;margin-top:18px;color:#5e4a19;font-size:.9rem}
  </style>
</head>
<body>
  <main class="card"><div class="tag">HospoLP</div><h1>Website Brief</h1><p>Use this short form to send us the information, photos, logo and menus we need to create the first version of your website.</p><a id="openForm" class="button" href="#">Start your website brief</a><div id="setup" class="setup">This form is being activated. Please use the client intake link supplied directly to you.</div></main>
  <script>
    // After the one-time Apps Script deployment, replace the value below with its /exec URL.
    const INTAKE_APP_URL = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';
    const button=document.getElementById('openForm');
    if(INTAKE_APP_URL.startsWith('https://')){button.href=INTAKE_APP_URL;button.target='_blank';button.rel='noopener';}else{button.addEventListener('click',e=>{e.preventDefault();document.getElementById('setup').style.display='block';});}
  </script>
</body>
</html>
